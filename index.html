
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habesha Girl 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171412;
      color: #fff7ed;
      text-align: center;
    }
    header { padding: 24px 16px 10px; }
    h1 { color: #e6bd78; }
    p { color: #d8c9b7; line-height: 1.6; }
    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      background: #f8f1e8;
    }
    .hint { padding: 12px; }
    footer { padding: 20px; color: #bca98f; }
  </style>
</head>
<body>
  <header>
    <h1>Habesha Girl Collection</h1>
    <p>Discover Ethiopian beauty and tradition in 3D.</p>
  </header>

  <model-viewer
    src="habesha-girl.glb"
    alt="Traditional Habesha girl keychain"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

  <p class="hint">👆 Drag to rotate · Pinch to zoom</p>
  <footer>Made with love for Ethiopian culture 🇪🇹</footer>
</body>
</html>
